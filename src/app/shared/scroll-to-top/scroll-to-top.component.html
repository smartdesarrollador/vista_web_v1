<!-- Botón scroll to top con indicador de progreso -->
<button
  *ngIf="isVisible"
  type="button"
  (click)="scrollToTop()"
  class="scroll-to-top visible group"
  [attr.aria-label]="'Volver arriba - ' + scrollPercent.toFixed(0) + '% del contenido'"
  title="Volver al inicio"
>
  <!-- Indicador de progreso circular -->
  <div class="absolute inset-0 -rotate-90">
    <svg class="w-full h-full" viewBox="0 0 36 36">
      <!-- Círculo de fondo -->
      <path
        class="stroke-current text-white/20"
        stroke-width="2"
        fill="none"
        d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"
      />
      <!-- Círculo de progreso -->
      <path
        class="stroke-current text-white transition-all duration-300 ease-out"
        stroke-width="2"
        fill="none"
        stroke-linecap="round"
        [attr.stroke-dasharray]="scrollPercent + ', 100'"
        d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"
      />
    </svg>
  </div>

  <!-- Icono de flecha hacia arriba -->
  <div class="relative z-10 transition-transform duration-300 group-hover:-translate-y-0.5">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="w-5 h-5"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      stroke-width="2.5"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M5 10l7-7m0 0l7 7m-7-7v18"
      />
    </svg>
  </div>

  <!-- Efecto hover -->
  <div class="absolute inset-0 rounded-full bg-white/10 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
</button>

<!-- Indicador de progreso de lectura (barra superior opcional) -->
<div
  *ngIf="isVisible"
  class="fixed top-0 left-0 h-1 bg-gradient-to-r from-blue-500 to-purple-500 transition-all duration-300 ease-out z-50"
  [style.width.%]="scrollPercent"
></div>
